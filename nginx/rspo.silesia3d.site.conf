# Wzór bloku nginx. Na serwerze kopiowany do
# /etc/nginx/sites-available/rspo.silesia3d.site i dowiązywany w sites-enabled.
#
# W repozytorium leży dlatego, że to jedyny plik konfiguracji, którego nie
# widać w `docker compose` ani w kodzie — a przy przenoszeniu na inny serwer
# jest pierwszą rzeczą, której się szuka.
#
# UWAGA: certbot dopisze do TEGO pliku sekcję `listen 443 ssl`, ścieżki do
# certyfikatów i przekierowanie z http. Tamtych linii nie edytuj ręcznie
# i nie kopiuj ich z powrotem tutaj — przy odnowieniu i tak zostaną nadpisane.

server {
    listen 80;
    server_name rspo.silesia3d.site;

    # Plik z całej Polski waży ~42 MB, domyślny limit nginx to 1 MB. Bez tego
    # wgranie kończy się błędem 413 od nginx — czyli komunikatem bez polskiego
    # tekstu, zanim aplikacja w ogóle zobaczy żądanie. 256M zamiast 64M, żeby
    # sufit stawiała aplikacja (MAX_CONTENT_LENGTH = 250 MB) i żeby użytkownik
    # zobaczył NASZ komunikat, a nie stronę błędu serwera.
    client_max_body_size 256M;

    # RSPO nie ma własnego logowania (CLAUDE.md §5 — świadomie, bo narzędzie
    # chodziło lokalnie). Na serwerze pilnuje tego nginx. Bez tych trzech linii
    # każdy, kto zna adres, może wgrać dowolny plik przez /import, skasować
    # rejon i przeczytać notatki — wszystkie te ekrany są bezwarunkowe.
    auth_basic           "RSPO — SILESIA 3D";
    auth_basic_user_file /etc/nginx/.htpasswd-rspo;

    location / {
        proxy_pass         http://127.0.0.1:5310;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Wgranie 42-megabajtowego pliku to 56 190 wierszy do przeliczenia.
        # Tyle samo ma gunicorn (--timeout 900) — gdyby nginx odpadł wcześniej,
        # import szedłby dalej w tle, a użytkownik zobaczyłby 504 i wgrał plik
        # drugi raz, w połowie pierwszego.
        proxy_read_timeout    900s;
        proxy_send_timeout    900s;
        # Duży plik ma iść wprost do aplikacji, a nie najpierw w całości na
        # dysk nginx — inaczej czekanie liczy się podwójnie.
        proxy_request_buffering off;
    }
}
